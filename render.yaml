# One-click deploy on Render (free plan).
# Written answers for free: paste a Groq key (console.groq.com, no credit card).
# Prefer Claude? Add ANTHROPIC_API_KEY in the dashboard instead.
services:
  - type: web
    name: yakov-llm
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_USER
        value: yakov-ashgar27
      - key: SYNC_INTERVAL_MIN
        value: "30"
      - key: WEBHOOK_SECRET
        generateValue: true
