# One-click deploy on Render (free plan).
# Written answers for free: paste a Gemini key (aistudio.google.com/apikey).
# Other options (set in the dashboard instead): GROQ_API_KEY (free) or ANTHROPIC_API_KEY (Claude, paid).
services:
  - type: web
    name: yakov-llm
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    # Redeploy on every push that changes the app. Knowledge-base commits from the
    # refresh Action don't need a redeploy: the running server syncs with GitHub itself.
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - yakovllm/**
        - web/**
        - Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_USER
        value: yakov-ashgar27
      - key: SYNC_INTERVAL_MIN
        value: "30"
      - key: WEBHOOK_SECRET
        generateValue: true
      # Password of the memory page (/admin.html). Render generates it: Environment tab -> ADMIN_TOKEN.
      - key: ADMIN_TOKEN
        generateValue: true
      # Keep the conversation memory across deploys in a PRIVATE repo (optional).
      - key: MEMORY_REPO
        value: yakov-ashgar27/yakov-llm-memory
      - key: MEMORY_TOKEN
        sync: false
