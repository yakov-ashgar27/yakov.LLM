# One-click deploy on Render (free plan). Add ANTHROPIC_API_KEY in the dashboard.
services:
  - type: web
    name: yakov-llm
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_USER
        value: yakov-ashgar27
      - key: SYNC_INTERVAL_MIN
        value: "30"
      - key: WEBHOOK_SECRET
        generateValue: true
