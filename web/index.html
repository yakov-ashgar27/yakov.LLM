<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>yakov.LLM</title>
  <meta name="description" content="עוזר AI שמכיר את כל הפרויקטים של יעקב אשגר ב-GitHub: שואלים על הקוד ומקבלים תשובה עם הפניה לשורות המדויקות.">
  <meta name="theme-color" content="#b509ac">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script>
    window.YAKOV_CONFIG = {
      ownerName: 'Yakov Ashgar',
      // the static demo refreshes itself from here (rebuilt by the GitHub Action)
      kbUrl: 'https://raw.githubusercontent.com/yakov-ashgar27/yakov.LLM/main/data/kb.json'
    };
  </script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="שיחות">
    <div class="brand"><span data-logo="28"></span><span class="brand-name">yakov<b>.</b>LLM</span></div>
    <button class="new-chat" id="new-chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      שיחה חדשה
    </button>
    <nav class="history" id="history" role="list" aria-label="היסטוריית שיחות"></nav>
    <div class="side-foot">
      <button class="sync" id="sync-btn" aria-label="מצב הסנכרון עם GitHub">
        <span class="dot" id="sync-dot"></span><span id="sync-text">טוען…</span>
      </button>
      <div class="foot-row">
        <button class="text-btn" id="projects-btn">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span><span id="repo-count">0</span> פרויקטים מ-GitHub</span>
        </button>
        <button class="icon-btn" id="theme" aria-label="מעבר למצב כהה">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" id="menu" aria-label="תפריט">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <div class="title" id="chat-title" dir="auto"></div>
      <span class="mode-pill" id="mode">…</span>
    </div>

    <div class="scroller" id="scroller">
      <section class="welcome" id="welcome">
        <span data-logo="44"></span>
        <h1>מה תרצה לדעת על הפרויקטים של יעקב?</h1>
        <p class="lead">yakov.LLM קרא את כל הקוד והתיעוד בחשבון ה-GitHub שלו. שאל על כל דבר, ותקבל תשובה עם הפניה לקובץ ולשורות המדויקות.</p>
        <div class="starters">
          <button class="starter" data-ask="מי זה יעקב, ובמה הוא חזק כמפתח?">מי זה יעקב?</button>
          <button class="starter" data-ask="איזה פרויקט הכי מרשים מבחינה הנדסית, ולמה?">הפרויקט הכי מרשים</button>
          <button class="starter" data-ask="איך האויב בבומברמן מוצא את המסלול הקצר ביותר לשחקן?">BFS בבומברמן</button>
          <button class="starter" data-ask="איך FitVision סופרת חזרות מזוויות המפרקים?">ספירת חזרות ב-FitVision</button>
          <button class="starter" data-ask="How does The Map Lies prove every lie can be found without guessing?">The Map Lies validator</button>
        </div>
        <div class="projects" id="projects"></div>
      </section>
      <div class="thread" id="thread" aria-live="polite"></div>
    </div>

    <div class="dock">
      <div class="composer">
        <label class="sr-only" for="input">שאלה ל-yakov.LLM</label>
        <textarea id="input" rows="1" dir="auto" placeholder="שאל על הקוד, על ההחלטות או איך להריץ…"></textarea>
        <div class="composer-row">
          <label class="sr-only" for="scope">חיפוש בפרויקט</label>
          <select class="scope" id="scope"><option value="">כל הפרויקטים</option></select>
          <span class="spacer"></span>
          <button class="icon-btn mic" id="mic" aria-label="הכתבה קולית">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button class="send" id="send" aria-label="שליחה" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <p class="fine">התשובות מבוססות על הקוד ב-GitHub ועלולות לטעות. כדאי לבדוק את המקורות.</p>
    </div>
  </main>
</div>

<aside class="drawer" id="drawer" aria-hidden="true" aria-label="מקור">
  <header>
    <div class="where"><div class="repo" id="d-repo"></div><div class="path" id="d-path"></div><div class="lines" id="d-lines"></div></div>
    <button class="icon-btn" id="drawer-close" aria-label="סגירה">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="body" id="d-body"></div>
  <footer>
    <a class="btn primary" id="d-github" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg>
      פתח ב-GitHub
    </a>
    <span class="terms" id="d-terms"></span>
  </footer>
</aside>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <header>
    <h2 id="modal-title">הפרויקטים שלך ב-GitHub</h2>
    <button class="icon-btn" id="modal-close" aria-label="סגירה">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="content">
    <div id="repo-list"></div>
    <p class="how" id="how"></p>
    <button class="btn" id="sync-now" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
      בדוק עדכונים עכשיו
    </button>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="toast" id="toast" role="status"></div>

<script src="engine.js"></script>
<script src="markdown.js"></script>
<script src="app.js"></script>
</body>
</html>
